# 모든 앱이 spring.config.import 로 가져오는 DB·JPA 설정.
# 기본(로컬)·테스트는 H2 인메모리. MySQL은 local-dev 프로필(domain-local-dev.yml)을 쓴다.
spring:
  datasource:
    url: jdbc:h2:mem:naquiz;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

naquiz:
  # 초기 데이터(sql/initial-data.sql). 앱이 시작할 때 song 테이블이 비어 있으면 넣는다(InitialDataLoader).
  initial-data:
    enabled: true
  game:
    # 출제할 문제의 준비(노래 음원 등)가 연속으로 이만큼 실패하면 출제하지 못한다.
    max-prepare-failures: 3
  # 노래 정보(Spotify)·음원(YouTube) 조회. 규칙은 docs/MUSIC_SELECTION_RULE.md
  song:
    # 외부 호출 응답 대기 상한. Spotify 429의 retry-after가 이 시간을 넘으면 기다리지 않고 실패로 본다.
    request-timeout: 5s
    # 출제할 때 YouTube 검색 시도 횟수. 모두 실패하면 다음 곡을 출제한다. Spotify는 한 번만 조회한다.
    youtube-max-attempts: 3
    spotify:
      # 키는 커밋하지 않고 환경 변수로 받는다. 비어 있으면 Spotify 조회가 실패한다.
      client-id: ${SPOTIFY_CLIENT_ID:}
      client-secret: ${SPOTIFY_CLIENT_SECRET:}
