# 모든 앱이 spring.config.import 로 가져오는 DB·JPA 설정.
# 기본(로컬)·테스트는 H2 인메모리. MySQL은 local-dev 프로필(domain-local-dev.yml)을 쓴다.
spring:
  datasource:
    url: jdbc:h2:mem:naquiz;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

naquiz:
  # 초기 데이터(sql/initial-data.sql). 앱이 시작할 때 song 테이블이 비어 있으면 넣는다(InitialDataLoader).
  initial-data:
    enabled: true
