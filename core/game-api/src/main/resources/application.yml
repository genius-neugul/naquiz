spring:
  application:
    name: game-api
  config:
    import: classpath:domain.yml

server:
  port: 8080

app:
  websocket:
    # 게임 앱 개발 서버. Vite 프록시로 붙으면 같은 출처라 필요 없지만 직접 붙는 경우를 위해 둔다.
    allowed-origins: http://localhost:5173
  game:
    # 정답자가 나온 뒤 정답을 보여주고 다음 라운드를 열기까지 기다리는 시간
    next-round-delay: 3s
    # 스틸컷 게임에서 다음 스틸컷으로 넘어가는 간격
    still-cut-interval: 10s
    # 영화 스무고개에서 차례 참가자가 단서를 고르는 시간. 지나면 다음 차례로 넘어간다
    turn-duration: 10s
    # 영화 스무고개에서 고른 단서를 모두에게 표시한 뒤 공개하기까지 기다리는 시간
    clue-reveal-delay: 3s
